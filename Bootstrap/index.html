<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Practice</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar bg-primary">
        <div class="container">
            <div>
                <a href="#" class="text-white me-3 text-decoration-none">Home</a>
                <a href="#" class="text-white text-decoration-none">Register</a>
            </div>
        </div>
    </nav>

    <div class="container bg-light py-4">
        <h1 class="display-4 fw-bold text-dark text-center">
            Student Registration Form
        </h1>
    </div>

    <div class="container mt-5">
        <h3 class="mb-4">Student List</h3>

        <div class="row">

            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body bg-info text-dark">
                        <h5>Bhanu</h5>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body bg-primary text-white">
                        <h5>Rohit</h5>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body bg-success text-white">
                        <h5>Mahesh</h5>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <form class="container mt-5 p-4 shadow rounded bg-light" onsubmit="validateForm(event)">

        <h3 class="text-center mb-4">Form</h3>

        <div id="message"></div>

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" id="name" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Branch</label>

            <select id="branch" class="form-select">
                <option value="">Select Branch</option>
                <option>CSE</option>
                <option>AIML</option>
                <option>ECE</option>
            </select>
        </div>

        <button class="btn btn-primary w-100">
            Submit
        </button>

    </form>

    <div class="container mt-5">
        <h3 class="mb-4">Student Table</h3>
        <table class="table table-striped table-bordered table-hover">

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Branch</th>
            </tr>

            <tr>
                <td>101</td>
                <td>Bhanu</td>
                <td>CSE</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Rohit</td>
                <td>AIML</td>
            </tr>

            <tr>
                <td>103</td>
                <td>Mahesh</td>
                <td>ECE</td>
            </tr>

        </table>
    </div>

    <div class="container mt-4">
        <h3>Badges</h3>

        <span class="badge bg-primary">New</span>
        <span class="badge bg-success">Approved</span>
        <span class="badge bg-danger">Rejected</span>
    </div>

    <script>
        function validateForm(event) {
            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let branch = document.getElementById("branch").value;
            let msg = document.getElementById("message");

            if (name === "") {
                msg.innerHTML = `
                <div class="alert alert-danger">
                    Please enter your name.
                </div>`;
            }
            else if (email === "") {
                msg.innerHTML = `
                <div class="alert alert-warning">
                    Please enter your email.
                </div>`;
            }
            else if (branch === "") {
                msg.innerHTML = `
                <div class="alert alert-info">
                    Please select a branch.
                </div>`;
            }
            else {
                msg.innerHTML = `
                <div class="alert alert-success">
                    Registration Successful!
                </div>`;
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
