    <h2>Society Survey</h2>

    <form>

        <h3>Cleanliness Satisfaction</h3>

        <input type="radio" id="excellent" name="cleanliness">
        <label for="excellent">Excellent</label>

        <input type="radio" id="good" name="cleanliness">
        <label for="good">Good</label>

        <input type="radio" id="average" name="cleanliness">
        <label for="average">Average</label>

        <input type="radio" id="poor" name="cleanliness">
        <label for="poor">Poor</label>

        <h3>Security Service Feedback</h3>

        <select>
            <option>Excellent</option>
            <option>Good</option>
            <option>Average</option>
            <option>Poor</option>
        </select>

        <h3>Parking Issues</h3>

        <input type="checkbox" id="space">
        <label for="space">Insufficient Parking Space</label><br>

        <input type="checkbox" id="illegal">
        <label for="illegal">Improper Parking</label><br>

        <input type="checkbox" id="visitor">
        <label for="visitor">Visitor Parking Issues</label>

        <h3>Water Supply Feedback</h3>

        <select>
            <option>Excellent</option>
            <option>Good</option>
            <option>Average</option>
            <option>Poor</option>
        </select>

        <h3>Maintenance Quality</h3>

        <input type="radio" id="m1" name="maintenance">
        <label for="m1">Excellent</label>

        <input type="radio" id="m2" name="maintenance">
        <label for="m2">Good</label>

        <input type="radio" id="m3" name="maintenance">
        <label for="m3">Average</label>

        <input type="radio" id="m4" name="maintenance">
        <label for="m4">Poor</label>

        <h3>Suggestions</h3>

        <textarea rows="5" cols="40" placeholder="Enter your suggestions here"></textarea>

        <br><br>

        <button type="submit">Submit Survey</button>

    </form>

</body>

</html>
