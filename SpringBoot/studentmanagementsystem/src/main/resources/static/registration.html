<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#0f172a;">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="images/logo.png" alt="CVR Logo" width="45" height="45" class="me-2 rounded-circle">
                <span class="fw-bold">CVR College of Engineering</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="registration.html">Registration</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>

    <section class="container my-5">

        <div class="text-center mb-5">
            <h1 class="fw-bold">Student Registration Form</h1>
            <p class="text-muted">
                Fill in your details to register in the Student Management Portal.
            </p>
        </div>

        <div class="card shadow">

            <div class="card-body p-4">
                <form id="studentForm" class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="fullName" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Roll Number</label>
                        <input type="text" id="rollNumber" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text">@</span>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Mobile Number</label>
                        <input type="tel" id="mobile" class="form-control" pattern="[0-9]{10}" maxlength="10" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Gender</label>

                        <select id="gender" class="form-select" required>
                            <option selected disabled value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Branch</label>

                        <select id="branch" class="form-select" required>
                            <option selected disabled value="">Select Branch</option>
                            <option value="CSE">CSE</option>
                            <option value="ECE">ECE</option>
                            <option value="AIML">AIML</option>
                            <option value="IT">IT</option>
                            <option value="EEE">EEE</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" id="dob" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Upload Photo</label>
                        <input type="file" class="form-control">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <textarea id="address" class="form-control" rows="4" required></textarea>
                    </div>

                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="terms" required>

                            <label class="form-check-label" for="terms">
                                I agree to the Terms and Conditions
                            </label>
                        </div>
                    </div>

                    <div class="col-12 text-center mt-4">

                        <button type="submit" class="btn btn-primary btn-lg me-2">
                            Register
                        </button>

                        <button type="reset" class="btn btn-outline-secondary btn-lg">
                            Reset
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </section>

    <footer class="bg-dark text-light py-4 mt-5">

        <div class="container text-center">

            <p class="mb-1">
                © 2026 CVR College of Engineering. All Rights Reserved.
            </p>

            <p class="mb-0">
                Student Management Portal
            </p>

        </div>

    </footer>
    <script src="js/registration.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
